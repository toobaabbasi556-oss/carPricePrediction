[project]
name = "pkcar"
version = "0.1.0"
description = "PK Used-Car Valuation Service — asking-price prediction with intervals, SHAP, and a deployed API/demo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Tooba Maqsood" }]

# Pinned deps. Bump deliberately, one PR at a time.
dependencies = [
    # scrape (SPEC §2)
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pyyaml==6.0.2",
    # data
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyarrow==18.1.0",
    # modeling (SPEC §5–§6)
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "catboost==1.2.10",  # >=1.2.8 supports numpy 2.x; 1.2.7 pinned numpy<2 (conflict)
    "mapie==0.9.1",
    "shap==0.46.0",
    # tracking (SPEC §8)
    "mlflow==2.19.0",
    # plots
    "matplotlib==3.9.3",
    "seaborn==0.13.2",
    # serving (SPEC §8)
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "streamlit==1.41.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "httpx==0.28.1",   # FastAPI TestClient (starlette) dependency
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkcar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "api"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." so shared test helpers import as tests.<module>
testpaths = ["tests"]
